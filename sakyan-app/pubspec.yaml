name: sakyan_app
description: Sakyan — Car Rental Mobile App for Customers and Partners.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # HTTP
  dio: ^5.7.0

  # Auth & Storage
  supabase_flutter: ^2.7.0
  google_sign_in: ^6.2.2

  # Local Storage
  shared_preferences: ^2.3.2

  # Maps (OpenStreetMap - free)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Calendar / Date Picker
  table_calendar: ^3.1.2

  # UI & Animations
  shimmer: ^3.0.0
  animations: ^2.0.11
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.3

  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0

  # Push Notifications (FCM)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/images/
    - assets/icons/
