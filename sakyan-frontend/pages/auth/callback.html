<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sakyan — OAuth Callback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: Inter, sans-serif; background: #f8f9fa; }
    .spinner-border { color: #e63946; width: 3rem; height: 3rem; }
  </style>
</head>
<body>
  <div class="text-center">
    <div class="spinner-border mb-3" role="status"></div>
    <p class="text-muted">Completing sign in…</p>
  </div>

  <script src="/public/assets/js/config.js"></script>
  <script src="/public/assets/js/utils.js"></script>
  <script src="/public/assets/js/api.js"></script>
  <script src="/public/assets/js/auth.js"></script>
  <script>
    // Supabase redirects here after Google OAuth
    // handleOAuthCallback() in auth.js reads the session and redirects by role
    window.addEventListener('load', () => handleOAuthCallback());
  </script>
</body>
</html>
