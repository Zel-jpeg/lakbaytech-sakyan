<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — Sakyan</title>
  <meta name="description" content="Create your Sakyan account and start browsing or listing cars."/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 0; }
    .auth-card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.08); padding: 40px; width: 100%; max-width: 440px; }
    .auth-logo { font-size: 1.6rem; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
    .auth-logo span { color: #e63946; }
    .btn-google { background: white; border: 1.5px solid #dee2e6; color: #333; font-weight: 500; display: flex; align-items: center; gap: 10px; justify-content: center; transition: all .2s; }
    .btn-google:hover { border-color: #e63946; color: #e63946; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .btn-primary-sakyan { background: #e63946; border-color: #e63946; font-weight: 600; }
    .btn-primary-sakyan:hover { background: #c1121f; border-color: #c1121f; }
    .divider { display: flex; align-items: center; gap: 12px; color: #adb5bd; font-size:.85rem; margin: 20px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #dee2e6; }
    .form-control:focus { border-color: #e63946; box-shadow: 0 0 0 .2rem rgba(230,57,70,.15); }
    .form-label { font-weight: 500; font-size: .9rem; color: #495057; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-logo">🚗 Sak<span>yan</span></div>
      <p class="text-muted mb-0" style="font-size:.9rem">Start your journey today</p>
    </div>

    <h5 class="mb-1" style="font-weight:700">Create your account</h5>
    <p class="text-muted mb-4" style="font-size:.9rem">Free to join. No listing fees.</p>

    <!-- Google Register -->
    <button id="btn-google" class="btn btn-google w-100 mb-2" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.6 0 6.5 1.2 8.9 3.2l6.6-6.6C35.3 2.5 30 0 24 0 14.7 0 6.8 5.5 2.9 13.6l7.7 6C12.4 13.3 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.9 7.2l7.6 5.9c4.4-4.1 7.1-10.1 7.1-17.1z"/><path fill="#FBBC05" d="M10.6 28.4A14.5 14.5 0 0 1 9.5 24c0-1.5.3-3 .7-4.4l-7.7-6A24 24 0 0 0 0 24c0 3.8.9 7.4 2.5 10.6l8.1-6.2z"/><path fill="#34A853" d="M24 48c6.1 0 11.2-2 14.9-5.4l-7.6-5.9c-2 1.4-4.6 2.2-7.3 2.2-6.3 0-11.6-3.8-13.4-9.2l-8.1 6.2C6.8 42.5 14.7 48 24 48z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or register with email</div>

    <form id="register-form" onsubmit="handleRegister(event)">
      <div class="mb-3">
        <label class="form-label" for="full_name">Full Name</label>
        <input type="text" id="full_name" class="form-control" placeholder="Juan dela Cruz" required/>
      </div>
      <div class="mb-3">
        <label class="form-label" for="email">Email address</label>
        <input type="email" id="email" class="form-control" placeholder="you@example.com" required/>
      </div>
      <div class="mb-3">
        <label class="form-label" for="phone">Phone Number</label>
        <input type="tel" id="phone" class="form-control" placeholder="09XXXXXXXXX"/>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required/>
      </div>
      <div class="mb-4">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" class="form-control" placeholder="Repeat your password" required/>
      </div>

      <p class="text-muted mb-3" style="font-size:.8rem">
        By creating an account, you agree to Sakyan's <a href="#" style="color:#e63946">Terms of Service</a> and <a href="#" style="color:#e63946">Privacy Policy</a>.
      </p>

      <button type="submit" id="btn-register" class="btn btn-primary-sakyan btn-primary w-100">Create Account</button>
    </form>

    <p class="text-center text-muted mt-4 mb-0" style="font-size:.9rem">
      Already have an account? <a href="/pages/auth/login.html" class="text-decoration-none fw-600" style="color:#e63946">Sign in</a>
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/assets/js/config.js"></script>
  <script src="/public/assets/js/utils.js"></script>
  <script src="/public/assets/js/api.js"></script>
  <script src="/public/assets/js/auth.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm  = document.getElementById('confirm_password').value;
      if (password !== confirm) { showToast('Passwords do not match', 'danger'); return; }

      const btn = document.getElementById('btn-register');
      setButtonLoading(btn, true, 'Creating account...');
      try {
        await register(
          document.getElementById('email').value,
          password,
          document.getElementById('full_name').value,
          document.getElementById('phone').value
        );
      } finally {
        setButtonLoading(btn, false, 'Create Account');
      }
    }
  </script>
</body>
</html>
