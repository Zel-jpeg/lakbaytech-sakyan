<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking Confirmed — Sakyan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --red: #e63946; --dark: #1a1a2e; }
    * { font-family: 'Inter', sans-serif; }
    body { background: #f8f9fa; display: flex; align-items: center; min-height: 100vh; }
    .confirm-card { max-width: 560px; width: 100%; margin: auto; background: white; border-radius: 20px; box-shadow: 0 4px 32px rgba(0,0,0,.1); padding: 48px; text-align: center; }
    .success-icon { width: 80px; height: 80px; background: linear-gradient(135deg, #2dc653, #1a9940); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 24px; font-size: 2.2rem; animation: pop .4s ease; }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    .booking-code { background: #f8f9fa; border: 2px dashed #dee2e6; border-radius: 12px; padding: 16px 24px; font-size: 1.6rem; font-weight: 800; letter-spacing: 4px; color: var(--dark); margin: 20px 0; }
    .detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f3f5; font-size: .9rem; }
    .detail-row:last-child { border: none; }
    .detail-row .label { color: #6c757d; }
    .detail-row .value { font-weight: 600; color: var(--dark); }
    .btn-sakyan { background: var(--red); color: white; font-weight: 600; border: none; border-radius: 8px; }
    .btn-sakyan:hover { background: #c1121f; color: white; }
    .status-badge { background: #fff3cd; color: #856404; border: 1px solid #ffecb5; border-radius: 20px; padding: 4px 16px; font-size: .82rem; font-weight: 600; display: inline-block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="confirm-card">
      <div class="success-icon">✅</div>
      <h2 style="font-weight:800;color:var(--dark)">Booking Submitted!</h2>
      <p class="text-muted">Your booking request has been sent to the partner. They will confirm within <strong>24 hours</strong>.</p>

      <div class="status-badge mb-3">⏳ Pending Partner Approval</div>

      <div class="booking-code" id="booking-code">SKY-XXXXXXXX</div>
      <p class="text-muted" style="font-size:.82rem">Save this code — you'll need it for reference.</p>

      <div id="booking-details" class="text-start mt-3 mb-4"></div>

      <div class="d-grid gap-2">
        <a href="/pages/booking/my-bookings.html" class="btn btn-sakyan btn-lg">View My Bookings</a>
        <a href="/pages/messages/inbox.html" class="btn btn-outline-secondary">Message the Partner 💬</a>
        <a href="/pages/browse/cars.html" class="btn btn-link text-muted">Browse More Cars</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/public/assets/js/config.js"></script>
  <script src="/public/assets/js/utils.js"></script>
  <script src="/public/assets/js/api.js"></script>
  <script src="/public/assets/js/auth.js"></script>
  <script>
    const code = new URLSearchParams(window.location.search).get('code');
    if (code) {
      document.getElementById('booking-code').textContent = code;
      document.title = `${code} — Sakyan Booking`;
    }

    // Load booking details if user is logged in
    (async () => {
      const user = await requireAuth();
      if (!user || !code) return;
      try {
        const bookings = await api.get('/bookings/my');
        const booking  = (bookings.data || []).find(b => b.booking_code === code);
        if (!booking) return;

        document.getElementById('booking-details').innerHTML = `
          <div class="detail-row"><span class="label">Car</span><span class="value">${booking.car?.name ?? '—'}</span></div>
          <div class="detail-row"><span class="label">Pick-up Date</span><span class="value">${formatDate(booking.start_date)}</span></div>
          <div class="detail-row"><span class="label">Return Date</span><span class="value">${formatDate(booking.end_date)}</span></div>
          <div class="detail-row"><span class="label">Duration</span><span class="value">${booking.total_days} day${booking.total_days>1?'s':''}</span></div>
          <div class="detail-row"><span class="label">Subtotal</span><span class="value">${formatPHP(booking.subtotal)}</span></div>
          <div class="detail-row"><span class="label">Booking Fee</span><span class="value">${formatPHP(booking.booking_fee)}</span></div>
          <div class="detail-row"><span class="label" style="font-weight:700">Total Paid</span><span class="value" style="color:var(--red)">${formatPHP(booking.total_amount)}</span></div>
        `;
      } catch {}
    })();
  </script>
</body>
</html>
