<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Bookings — Sakyan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --red: #e63946; --dark: #1a1a2e; }
    * { font-family: 'Inter', sans-serif; }
    body { background: #f8f9fa; }
    .sakyan-nav { background: white; box-shadow: 0 1px 12px rgba(0,0,0,.07); position: sticky; top: 0; z-index: 1000; }
    .navbar-brand { font-size: 1.4rem; font-weight: 800; color: var(--dark) !important; }
    .navbar-brand span { color: var(--red); }
    .page-header { background: linear-gradient(135deg, var(--dark), #16213e); color: white; padding: 32px 0; }

    /* Booking card */
    .booking-card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.06); border: 1px solid #f1f3f5; transition: all .2s; margin-bottom: 16px; }
    .booking-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.1); }
    .booking-code { font-size: .8rem; font-weight: 700; letter-spacing: 1px; color: #6c757d; font-family: monospace; }
    .car-thumb { width: 80px; height: 60px; object-fit: cover; border-radius: 8px; }
    .btn-sakyan { background: var(--red); color: white; font-weight: 600; border: none; border-radius: 8px; }
    .btn-sakyan:hover { background: #c1121f; color: white; }

    /* Status badges */
    .status-badge { border-radius: 20px; padding: 3px 12px; font-size: .75rem; font-weight: 700; }
    .status-pending_review { background: #fff3cd; color: #856404; }
    .status-approved  { background: #d1e7dd; color: #0a3622; }
    .status-active    { background: #cfe2ff; color: #084298; }
    .status-completed { background: #e2e3e5; color: #383d41; }
    .status-cancelled { background: #f8d7da; color: #842029; }
    .status-rejected  { background: #f8d7da; color: #842029; }

    /* Tabs */
    .nav-pills .nav-link { color: #6c757d; border-radius: 8px; font-weight: 500; }
    .nav-pills .nav-link.active { background: var(--red); color: white; }
  </style>
</head>
<body>

<nav class="navbar sakyan-nav navbar-expand-lg py-3">
  <div class="container">
    <a class="navbar-brand" href="/public/index.html">🚗 Sak<span>yan</span></a>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-secondary btn-sm" href="/pages/browse/cars.html">Browse Cars</a>
      <a class="btn btn-sm" style="background:var(--red);color:white" href="#" onclick="logout()">Sign Out</a>
    </div>
  </div>
</nav>

<div class="page-header">
  <div class="container">
    <h1 style="font-size:1.6rem;font-weight:800;margin-bottom:4px">My Bookings</h1>
    <p class="mb-0" style="color:rgba(255,255,255,.7)">Track and manage your car rentals</p>
  </div>
</div>

<div class="container py-4">
  <!-- Filter tabs -->
  <ul class="nav nav-pills mb-4" id="status-tabs">
    <li class="nav-item"><button class="nav-link active" onclick="filterBookings('all')">All</button></li>
    <li class="nav-item"><button class="nav-link" onclick="filterBookings('pending_review')">⏳ Pending</button></li>
    <li class="nav-item"><button class="nav-link" onclick="filterBookings('approved')">✅ Approved</button></li>
    <li class="nav-item"><button class="nav-link" onclick="filterBookings('active')">🚗 Active</button></li>
    <li class="nav-item"><button class="nav-link" onclick="filterBookings('completed')">🏁 Completed</button></li>
    <li class="nav-item"><button class="nav-link" onclick="filterBookings('cancelled')">❌ Cancelled</button></li>
  </ul>

  <div id="bookings-list">
    <div class="d-flex justify-content-center py-5">
      <div class="spinner-border" style="color:var(--red)" role="status"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/assets/js/config.js"></script>
<script src="/public/assets/js/utils.js"></script>
<script src="/public/assets/js/api.js"></script>
<script src="/public/assets/js/auth.js"></script>
<script>
  let allBookings = [];
  let currentFilter = 'all';

  const statusLabels = {
    pending_review: '⏳ Pending Review',
    approved:  '✅ Approved',
    active:    '🚗 Active',
    completed: '🏁 Completed',
    cancelled: '❌ Cancelled',
    rejected:  '❌ Rejected',
  };

  async function init() {
    await requireAuth();
    try {
      const res = await api.get('/bookings/my');
      allBookings = res.data || [];
      renderBookings();
    } catch (err) {
      document.getElementById('bookings-list').innerHTML = `<div class="text-center text-danger py-4">${err.message}</div>`;
    }
  }

  function filterBookings(status) {
    currentFilter = status;
    document.querySelectorAll('#status-tabs .nav-link').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderBookings();
  }

  function renderBookings() {
    const filtered = currentFilter === 'all'
      ? allBookings
      : allBookings.filter(b => b.booking_status === currentFilter);

    const container = document.getElementById('bookings-list');
    if (!filtered.length) {
      container.innerHTML = `<div class="text-center py-5 text-muted"><div style="font-size:3rem">🚗</div><h5>No bookings found</h5><a href="/pages/browse/cars.html" class="btn btn-sakyan mt-2">Browse Cars</a></div>`;
      return;
    }

    container.innerHTML = filtered.map(b => {
      const img = b.car?.primary_image?.image_url || 'https://via.placeholder.com/80x60?text=Car';
      const canCancel = ['pending_review','approved'].includes(b.booking_status);
      return `
        <div class="booking-card">
          <div class="d-flex gap-3 align-items-start">
            <img src="${img}" alt="Car" class="car-thumb"/>
            <div class="flex-grow-1">
              <div class="d-flex justify-content-between flex-wrap gap-2">
                <div>
                  <div class="fw-700" style="font-weight:700">${b.car?.name ?? 'Car'}</div>
                  <div class="booking-code">${b.booking_code}</div>
                </div>
                <span class="status-badge status-${b.booking_status}">${statusLabels[b.booking_status] ?? b.booking_status}</span>
              </div>
              <div class="d-flex flex-wrap gap-3 mt-2" style="font-size:.85rem;color:#6c757d">
                <span>📅 ${formatDate(b.start_date)} → ${formatDate(b.end_date)}</span>
                <span>🗓 ${b.total_days} day${b.total_days>1?'s':''}</span>
                <span>💰 ${formatPHP(b.total_amount)}</span>
              </div>
            </div>
          </div>
          <div class="d-flex gap-2 mt-3 justify-content-end">
            <a href="/pages/booking/checkout.html?booking_id=${b.id}" class="btn btn-sm btn-outline-secondary">View Details</a>
            <a href="/pages/messages/inbox.html?booking_id=${b.id}" class="btn btn-sm btn-outline-secondary">💬 Message</a>
            ${canCancel ? `<button class="btn btn-sm btn-outline-danger" onclick="cancelBooking('${b.id}')">Cancel</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  async function cancelBooking(bookingId) {
    if (!confirm('Are you sure you want to cancel this booking?')) return;
    try {
      await api.patch('/bookings/' + bookingId + '/cancel');
      showToast('Booking cancelled.', 'success');
      const res = await api.get('/bookings/my');
      allBookings = res.data || [];
      renderBookings();
    } catch (err) {
      showToast('Cancel failed: ' + err.message, 'danger');
    }
  }

  init();
</script>
</body>
</html>
