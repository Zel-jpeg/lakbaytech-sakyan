<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Browse Cars — Sakyan</title>
  <meta name="description" content="Browse hundreds of rental cars across the Philippines. Filter by location, price, and more."/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --red: #e63946; --dark: #1a1a2e; }
    * { font-family: 'Inter', sans-serif; }
    .sakyan-nav { background: white; box-shadow: 0 1px 12px rgba(0,0,0,.07); position: sticky; top: 0; z-index: 1000; }
    .navbar-brand { font-size: 1.4rem; font-weight: 800; color: var(--dark) !important; }
    .navbar-brand span { color: var(--red); }
    .btn-sakyan { background: var(--red); color: white; font-weight: 600; border-radius: 8px; border: none; }
    .btn-sakyan:hover { background: #c1121f; color: white; }
    .btn-outline-sakyan { border: 1.5px solid var(--red); color: var(--red); font-weight: 600; border-radius: 8px; }
    .btn-outline-sakyan:hover { background: var(--red); color: white; }

    /* Sidebar filters */
    .filter-card { background: white; border-radius: 14px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,.06); border: 1px solid #f1f3f5; position: sticky; top: 80px; }
    .filter-card h6 { font-weight: 700; color: var(--dark); font-size: .85rem; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; }
    .form-control:focus, .form-select:focus { border-color: var(--red); box-shadow: 0 0 0 .2rem rgba(230,57,70,.12); }
    .form-check-input:checked { background-color: var(--red); border-color: var(--red); }

    /* Car cards */
    .car-card { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 2px 16px rgba(0,0,0,.07); transition: all .25s; border: 1px solid #f1f3f5; height: 100%; }
    .car-card:hover { transform: translateY(-4px); box-shadow: 0 8px 32px rgba(0,0,0,.12); }
    .car-card img { width: 100%; height: 190px; object-fit: cover; }
    .car-card .card-body { padding: 16px; display: flex; flex-direction: column; }
    .car-name { font-weight: 700; font-size: 1rem; color: var(--dark); }
    .car-location { font-size: .82rem; color: #6c757d; }
    .car-price { font-size: 1.1rem; font-weight: 800; color: var(--red); }
    .badge-pill { border-radius: 20px; font-size: .72rem; font-weight: 600; padding: 3px 10px; }
    .page-header { background: linear-gradient(135deg, var(--dark) 0%, #16213e 100%); color: white; padding: 40px 0; }

    /* Empty state */
    .empty-state { text-align: center; padding: 60px 20px; color: #6c757d; }
    .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
  </style>
</head>
<body style="background:#f8f9fa">

<!-- Navbar -->
<nav class="navbar sakyan-nav navbar-expand-lg py-3">
  <div class="container">
    <a class="navbar-brand" href="/public/index.html">🚗 Sak<span>yan</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-center gap-2">
        <li class="nav-item"><a class="nav-link fw-600" style="color:var(--red)" href="/pages/browse/cars.html">Browse Cars</a></li>
        <li class="nav-item"><a class="nav-link" href="/pages/onboarding/step1-type.html">List Your Car</a></li>
        <li class="nav-item" id="auth-buttons">
          <a class="btn btn-outline-sakyan me-2" href="/pages/auth/login.html">Sign In</a>
          <a class="btn btn-sakyan" href="/pages/auth/register.html">Sign Up</a>
        </li>
        <li class="nav-item d-none" id="user-menu">
          <div class="dropdown">
            <button class="btn btn-outline-secondary dropdown-toggle" id="user-name-btn">My Account</button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="/pages/booking/my-bookings.html">My Bookings</a></li>
              <li><a class="dropdown-item" href="/pages/messages/inbox.html">Messages</a></li>
              <li><hr class="dropdown-divider"/></li>
              <li><a class="dropdown-item text-danger" href="#" onclick="logout()">Sign Out</a></li>
            </ul>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Page Header -->
<div class="page-header">
  <div class="container">
    <h1 style="font-size:1.8rem;font-weight:800;margin-bottom:4px">Browse Cars</h1>
    <p class="mb-0" style="color:rgba(255,255,255,.7)">Find the perfect car for your trip</p>
  </div>
</div>

<div class="container py-4">
  <div class="row g-4">

    <!-- ── Filter Sidebar ─────────── -->
    <div class="col-lg-3">
      <div class="filter-card">
        <h6>📍 Location</h6>
        <input type="text" id="f-location" class="form-control form-control-sm mb-3" placeholder="City or area..."/>

        <h6>💰 Price Range (₱/day)</h6>
        <div class="d-flex gap-2 mb-3">
          <input type="number" id="f-min-price" class="form-control form-control-sm" placeholder="Min"/>
          <input type="number" id="f-max-price" class="form-control form-control-sm" placeholder="Max"/>
        </div>

        <h6>⚙️ Transmission</h6>
        <div class="mb-3">
          <div class="form-check form-check-sm">
            <input class="form-check-input" type="radio" name="transmission" id="t-any" value="" checked/>
            <label class="form-check-label" for="t-any">Any</label>
          </div>
          <div class="form-check form-check-sm">
            <input class="form-check-input" type="radio" name="transmission" id="t-auto" value="automatic"/>
            <label class="form-check-label" for="t-auto">Automatic</label>
          </div>
          <div class="form-check form-check-sm">
            <input class="form-check-input" type="radio" name="transmission" id="t-manual" value="manual"/>
            <label class="form-check-label" for="t-manual">Manual</label>
          </div>
        </div>

        <h6>⛽ Fuel Type</h6>
        <select id="f-fuel" class="form-select form-select-sm mb-3">
          <option value="">Any</option>
          <option value="gasoline">Gasoline</option>
          <option value="diesel">Diesel</option>
          <option value="electric">Electric</option>
          <option value="hybrid">Hybrid</option>
        </select>

        <h6>🪑 Minimum Seats</h6>
        <select id="f-seats" class="form-select form-select-sm mb-4">
          <option value="">Any</option>
          <option value="4">4+</option>
          <option value="5">5+</option>
          <option value="7">7+</option>
        </select>

        <button class="btn btn-sakyan w-100" onclick="applyFilters()">Apply Filters</button>
        <button class="btn btn-outline-secondary w-100 mt-2" onclick="clearFilters()">Clear</button>
      </div>
    </div>

    <!-- ── Car Grid ────────────────── -->
    <div class="col-lg-9">
      <!-- Results bar -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span id="results-count" class="text-muted" style="font-size:.9rem">Loading cars…</span>
        <select id="sort-by" class="form-select form-select-sm" style="width:160px" onchange="applyFilters()">
          <option value="created_at">Newest first</option>
          <option value="price_asc">Price: Low to High</option>
          <option value="price_desc">Price: High to Low</option>
        </select>
      </div>

      <!-- Grid -->
      <div class="row g-4" id="cars-grid">
        <div class="col-12 d-flex justify-content-center py-5">
          <div class="spinner-border" style="color:var(--red)" role="status"></div>
        </div>
      </div>

      <!-- Pagination -->
      <div id="pagination" class="d-flex justify-content-center gap-2 mt-4"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/assets/js/config.js"></script>
<script src="/public/assets/js/utils.js"></script>
<script src="/public/assets/js/api.js"></script>
<script src="/public/assets/js/auth.js"></script>
<script>
  let currentPage = 1;

  // Read URL params on load
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('location')) document.getElementById('f-location').value = urlParams.get('location');

  function getFilters() {
    const sort = document.getElementById('sort-by').value;
    const filters = {
      page: currentPage,
      per_page: 12,
    };
    const loc = document.getElementById('f-location').value.trim();
    const minP = document.getElementById('f-min-price').value;
    const maxP = document.getElementById('f-max-price').value;
    const fuel = document.getElementById('f-fuel').value;
    const seats = document.getElementById('f-seats').value;
    const trans = document.querySelector('input[name="transmission"]:checked')?.value;
    if (loc)   filters.location     = loc;
    if (minP)  filters.min_price    = minP;
    if (maxP)  filters.max_price    = maxP;
    if (fuel)  filters.fuel_type    = fuel;
    if (seats) filters.seats        = seats;
    if (trans) filters.transmission = trans;
    if (sort === 'price_asc')  { filters.sort = 'price_per_day'; filters.order = 'asc'; }
    if (sort === 'price_desc') { filters.sort = 'price_per_day'; filters.order = 'desc'; }
    return filters;
  }

  async function loadCars() {
    const grid = document.getElementById('cars-grid');
    grid.innerHTML = '<div class="col-12 d-flex justify-content-center py-5"><div class="spinner-border" style="color:var(--red)" role="status"></div></div>';

    try {
      const params = new URLSearchParams(getFilters()).toString();
      const res = await api.get('/cars?' + params);
      const cars = res.data?.data || [];
      const total = res.data?.total || 0;
      const lastPage = res.data?.last_page || 1;

      document.getElementById('results-count').textContent = `${total} car${total !== 1 ? 's' : ''} found`;

      if (!cars.length) {
        grid.innerHTML = `<div class="col-12"><div class="empty-state"><div class="icon">🚘</div><h5>No cars found</h5><p>Try adjusting your filters or search in a different area.</p><a href="/pages/browse/cars.html" class="btn btn-sakyan">Clear All Filters</a></div></div>`;
        return;
      }

      grid.innerHTML = cars.map(car => `
        <div class="col-sm-6 col-xl-4">
          <a href="/pages/browse/car-detail.html?id=${car.id}" class="text-decoration-none d-block h-100">
            <div class="car-card">
              <img src="${car.primary_image?.image_url || 'https://via.placeholder.com/400x200?text=No+Photo'}" alt="${car.name}" loading="lazy"/>
              <div class="card-body">
                <div class="d-flex justify-content-between mb-1">
                  <span class="car-name">${car.name}</span>
                  <span class="badge bg-light text-dark badge-pill">${car.seats ?? 5} seats</span>
                </div>
                <div class="car-location mb-2">📍 ${car.location ?? '—'}</div>
                <div class="d-flex flex-wrap gap-1 mb-3">
                  ${car.transmission ? `<span class="badge bg-light text-dark badge-pill">${car.transmission}</span>` : ''}
                  ${car.fuel_type    ? `<span class="badge bg-light text-dark badge-pill">${car.fuel_type}</span>` : ''}
                </div>
                <div class="d-flex justify-content-between align-items-center mt-auto">
                  <div class="car-price">₱${parseFloat(car.price_per_day).toLocaleString()}<span style="font-weight:400;font-size:.78rem;color:#6c757d">/day</span></div>
                  <button class="btn btn-sakyan btn-sm px-3">Book Now</button>
                </div>
              </div>
            </div>
          </a>
        </div>
      `).join('');

      // Pagination
      const pag = document.getElementById('pagination');
      pag.innerHTML = '';
      for (let i = 1; i <= lastPage; i++) {
        const btn = document.createElement('button');
        btn.className = `btn btn-sm ${i === currentPage ? 'btn-sakyan' : 'btn-outline-secondary'}`;
        btn.textContent = i;
        btn.onclick = () => { currentPage = i; loadCars(); window.scrollTo(0,0); };
        pag.appendChild(btn);
      }
    } catch (err) {
      grid.innerHTML = `<div class="col-12 text-center py-5 text-muted"><div class="icon">⚠️</div><p>${err.message || 'Could not load cars.'}</p></div>`;
    }
  }

  function applyFilters() { currentPage = 1; loadCars(); }
  function clearFilters() {
    document.getElementById('f-location').value = '';
    document.getElementById('f-min-price').value = '';
    document.getElementById('f-max-price').value = '';
    document.getElementById('f-fuel').value = '';
    document.getElementById('f-seats').value = '';
    document.getElementById('t-any').checked = true;
    applyFilters();
  }

  // Enter to search
  document.getElementById('f-location').addEventListener('keypress', e => { if (e.key === 'Enter') applyFilters(); });

  // Auth nav
  (async () => {
    const token = localStorage.getItem('sakyan_token');
    if (token) {
      try {
        const user = await fetchMe();
        if (user) {
          document.getElementById('auth-buttons').classList.add('d-none');
          document.getElementById('user-menu').classList.remove('d-none');
          document.getElementById('user-name-btn').textContent = user.full_name?.split(' ')[0] || 'Account';
        }
      } catch {}
    }
  })();

  loadCars();
</script>
</body>
</html>
