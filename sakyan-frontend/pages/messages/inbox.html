<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages — Sakyan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --red: #e63946; --dark: #1a1a2e; }
    * { font-family: 'Inter', sans-serif; }
    html, body { height: 100%; margin: 0; }
    .sakyan-nav { background: white; box-shadow: 0 1px 12px rgba(0,0,0,.07); position: sticky; top: 0; z-index: 1000; }
    .navbar-brand { font-size: 1.4rem; font-weight: 800; color: var(--dark) !important; }
    .navbar-brand span { color: var(--red); }

    /* Chat layout */
    .chat-container { display: flex; height: calc(100vh - 64px); overflow: hidden; background: #f8f9fa; }

    /* Sidebar */
    .conv-sidebar { width: 320px; min-width: 280px; background: white; border-right: 1px solid #e9ecef; display: flex; flex-direction: column; }
    .conv-sidebar-header { padding: 16px; border-bottom: 1px solid #f1f3f5; font-weight: 700; color: var(--dark); }
    .conv-list { overflow-y: auto; flex: 1; }
    .conv-item { padding: 14px 16px; cursor: pointer; border-bottom: 1px solid #f8f9fa; transition: background .15s; }
    .conv-item:hover { background: #f8f9fa; }
    .conv-item.active { background: rgba(230,57,70,.06); border-left: 3px solid var(--red); }
    .conv-item .car-name { font-weight: 700; font-size: .9rem; color: var(--dark); }
    .conv-item .last-msg { font-size: .8rem; color: #6c757d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-item .unread-badge { background: var(--red); color: white; border-radius: 10px; padding: 1px 7px; font-size: .7rem; font-weight: 700; }

    /* Chat area */
    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: white; padding: 14px 20px; border-bottom: 1px solid #e9ecef; font-weight: 700; color: var(--dark); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 14px; font-size: .9rem; line-height: 1.4; }
    .msg-bubble.mine { background: var(--red); color: white; border-bottom-right-radius: 4px; align-self: flex-end; }
    .msg-bubble.theirs { background: white; color: var(--dark); border-bottom-left-radius: 4px; align-self: flex-start; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .msg-time { font-size: .7rem; margin-top: 2px; opacity: .6; }
    .chat-input { background: white; padding: 14px 20px; border-top: 1px solid #e9ecef; display: flex; gap: 10px; }
    .chat-input textarea { flex: 1; border-radius: 10px; padding: 10px 14px; border: 1.5px solid #dee2e6; resize: none; font-size: .9rem; }
    .chat-input textarea:focus { outline: none; border-color: var(--red); }
    .btn-send { background: var(--red); color: white; border: none; border-radius: 10px; padding: 0 20px; font-weight: 600; cursor: pointer; }
    .btn-send:hover { background: #c1121f; }
    .chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #6c757d; flex-direction: column; gap: 10px; }

    @media (max-width: 768px) {
      .conv-sidebar { width: 100%; display: block; }
      .chat-area { display: none; }
      .chat-area.active { display: flex; }
    }
  </style>
</head>
<body>

<nav class="navbar sakyan-nav py-3">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="/public/index.html">🚗 Sak<span>yan</span></a>
    <div class="d-flex gap-2">
      <a class="btn btn-sm btn-outline-secondary" href="/pages/booking/my-bookings.html">My Bookings</a>
      <a class="btn btn-sm" style="background:var(--red);color:white" href="#" onclick="logout()">Sign Out</a>
    </div>
  </div>
</nav>

<div class="chat-container">
  <!-- Conversation list -->
  <div class="conv-sidebar">
    <div class="conv-sidebar-header">💬 Messages</div>
    <div class="conv-list" id="conv-list">
      <div class="d-flex justify-content-center p-4">
        <div class="spinner-border spinner-border-sm" style="color:var(--red)"></div>
      </div>
    </div>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chat-area">
    <div class="chat-empty">
      <div style="font-size:3rem">💬</div>
      <div>Select a conversation</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/assets/js/config.js"></script>
<script src="/public/assets/js/utils.js"></script>
<script src="/public/assets/js/api.js"></script>
<script src="/public/assets/js/auth.js"></script>
<script>
  let currentUser = null;
  let activeBookingId = null;
  let pollInterval = null;

  async function init() {
    currentUser = await requireAuth();
    if (!currentUser) return;
    await loadConversations();

    // Auto-open from URL param
    const bookingId = new URLSearchParams(window.location.search).get('booking_id');
    if (bookingId) openChat(bookingId);
  }

  async function loadConversations() {
    try {
      const res = await api.get('/messages/conversations');
      const convs = res.data || [];
      const list  = document.getElementById('conv-list');

      if (!convs.length) {
        list.innerHTML = '<div class="p-4 text-center text-muted" style="font-size:.88rem">No conversations yet.<br>Book a car to start messaging.</div>';
        return;
      }

      list.innerHTML = convs.map(c => `
        <div class="conv-item ${c.id === activeBookingId ? 'active' : ''}" onclick="openChat('${c.id}')" id="conv-${c.id}">
          <div class="d-flex justify-content-between">
            <span class="car-name">${c.car?.name ?? 'Booking'}</span>
            ${c.unread_count > 0 ? `<span class="unread-badge">${c.unread_count}</span>` : ''}
          </div>
          <div class="last-msg">${c.last_message ?? 'No messages yet'}</div>
          <div style="font-size:.72rem;color:#adb5bd;margin-top:2px">${c.last_message_at ? formatDate(c.last_message_at) : ''}</div>
        </div>
      `).join('');
    } catch (err) {
      document.getElementById('conv-list').innerHTML = `<div class="p-4 text-danger">${err.message}</div>`;
    }
  }

  async function openChat(bookingId) {
    if (activeBookingId === bookingId) return;
    activeBookingId = bookingId;
    clearInterval(pollInterval);

    // Mark sidebar active
    document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
    document.getElementById('conv-' + bookingId)?.classList.add('active');

    const area = document.getElementById('chat-area');
    area.innerHTML = `
      <div class="chat-header" id="chat-title">Loading…</div>
      <div class="chat-messages" id="chat-messages">
        <div class="d-flex justify-content-center py-4"><div class="spinner-border spinner-border-sm" style="color:var(--red)"></div></div>
      </div>
      <div class="chat-input">
        <textarea id="msg-input" placeholder="Type a message…" rows="2" onkeydown="handleKey(event)"></textarea>
        <button class="btn-send" onclick="sendMessage()">Send →</button>
      </div>
    `;

    await loadMessages(bookingId);
    pollInterval = setInterval(() => loadMessages(bookingId), 5000);
  }

  async function loadMessages(bookingId) {
    try {
      const res      = await api.get('/messages/' + bookingId);
      const messages = res.data || [];
      const container = document.getElementById('chat-messages');
      if (!container) return;

      const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;

      container.innerHTML = messages.length
        ? messages.map(m => {
            const isMine = m.sender_id === currentUser.id;
            return `
              <div style="display:flex;flex-direction:column;align-items:${isMine?'flex-end':'flex-start'}">
                <div class="msg-bubble ${isMine?'mine':'theirs'}">${escapeHtml(m.content)}</div>
                <div class="msg-time" style="text-align:${isMine?'right':'left'}">${m.sender?.full_name?.split(' ')[0] ?? ''} · ${formatDate(m.created_at)}</div>
              </div>
            `;
          }).join('')
        : '<div class="text-center text-muted py-4" style="font-size:.85rem">No messages yet. Say hi! 👋</div>';

      if (wasAtBottom) container.scrollTop = container.scrollHeight;

      // Update unread badge
      const convEl = document.getElementById('conv-' + bookingId);
      if (convEl) convEl.querySelector('.unread-badge')?.remove();

    } catch (err) {
      document.getElementById('chat-title').textContent = 'Error loading messages';
    }
  }

  async function sendMessage() {
    const input = document.getElementById('msg-input');
    const content = input?.value?.trim();
    if (!content || !activeBookingId) return;
    input.value = '';
    try {
      await api.post('/messages', { booking_id: activeBookingId, content });
      await loadMessages(activeBookingId);
      await loadConversations();
    } catch (err) {
      showToast('Failed to send: ' + err.message, 'danger');
      input.value = content;
    }
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  init();
</script>
</body>
</html>
