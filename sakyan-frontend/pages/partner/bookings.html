<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Bookings — Partner | Sakyan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --red: #e63946; --dark: #1a1a2e; }
    * { font-family: 'Inter', sans-serif; }
    body { background: #f8f9fa; }
    .sidebar { width: 240px; min-height: 100vh; background: var(--dark); position: fixed; top: 0; left: 0; padding: 24px 0; display: flex; flex-direction: column; }
    .sidebar-logo { padding: 0 20px 20px; font-size: 1.2rem; font-weight: 800; color: white; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 12px; }
    .sidebar-logo span { color: var(--red); }
    .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: rgba(255,255,255,.7); text-decoration: none; font-size: .9rem; font-weight: 500; transition: all .15s; }
    .sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(255,255,255,.08); color: white; border-left: 3px solid var(--red); }
    .sidebar-badge { background: var(--red); color: white; border-radius: 10px; padding: 1px 7px; font-size: .7rem; margin-left: auto; }
    .sidebar-bottom { margin-top: auto; padding: 0 20px; }
    .main { margin-left: 240px; min-height: 100vh; }
    .topbar { background: white; padding: 16px 28px; border-bottom: 1px solid #f1f3f5; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 8px rgba(0,0,0,.05); }
    .page-content { padding: 28px; }
    .data-card { background: white; border-radius: 14px; padding: 20px; border: 1px solid #f1f3f5; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .table { font-size: .85rem; }
    .table thead th { font-size: .75rem; text-transform: uppercase; letter-spacing: .5px; color: #6c757d; font-weight: 600; border-bottom: 1px solid #f1f3f5; }
    .btn-sakyan { background: var(--red); color: white; font-weight: 600; border: none; border-radius: 8px; }
    .btn-sakyan:hover { background: #c1121f; color: white; }
    .form-control:focus, .form-select:focus { border-color: var(--red); box-shadow: 0 0 0 .2rem rgba(230,57,70,.12); }
    .badge-pending  { background: #fff3cd; color: #856404; border-radius: 20px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
    .badge-approved { background: #d1e7dd; color: #0a3622; border-radius: 20px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
    .badge-rejected { background: #f8d7da; color: #842029; border-radius: 20px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
    .badge-active   { background: #cfe2ff; color: #084298; border-radius: 20px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
    .badge-completed{ background: #e2e3e5; color: #383d41; border-radius: 20px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
    @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; } }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">🚗 Sak<span>yan</span></div>
  <nav class="sidebar-nav">
    <a href="/pages/partner/dashboard.html">📊 Dashboard</a>
    <a href="/pages/partner/cars.html">🚗 My Cars</a>
    <a href="/pages/partner/bookings.html" class="active">📋 Bookings</a>
    <a href="/pages/messages/inbox.html">💬 Messages</a>
    <a href="/pages/partner/profile.html">⚙️ Profile</a>
  </nav>
  <div class="sidebar-bottom">
    <a href="#" onclick="logout()" class="btn btn-outline-light w-100 btn-sm mb-2" style="border-radius:8px">Sign Out</a>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <h5 class="mb-0 fw-700" style="font-weight:700">Booking Requests</h5>
    <div class="d-flex gap-2 align-items-center">
      <select id="status-filter" class="form-select form-select-sm" style="width:160px" onchange="loadBookings()">
        <option value="">All Status</option>
        <option value="pending_review">⏳ Pending</option>
        <option value="approved">✅ Approved</option>
        <option value="active">🚗 Active</option>
        <option value="completed">🏁 Completed</option>
        <option value="cancelled">❌ Cancelled</option>
        <option value="rejected">❌ Rejected</option>
      </select>
    </div>
  </div>

  <div class="page-content">
    <div class="data-card">
      <div id="bookings-table">
        <div class="d-flex justify-content-center py-4">
          <div class="spinner-border" style="color:var(--red)"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Booking detail modal -->
<div class="modal fade" id="detailModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title fw-700" style="font-weight:700">Booking Detail</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="modal-body">Loading…</div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/assets/js/config.js"></script>
<script src="/public/assets/js/utils.js"></script>
<script src="/public/assets/js/api.js"></script>
<script src="/public/assets/js/auth.js"></script>
<script>
  const statusBadges = {
    pending_review: '<span class="badge-pending">⏳ Pending Review</span>',
    approved:  '<span class="badge-approved">✅ Approved</span>',
    active:    '<span class="badge-active">🚗 Active</span>',
    completed: '<span class="badge-completed">🏁 Completed</span>',
    cancelled: '<span class="badge-rejected">❌ Cancelled</span>',
    rejected:  '<span class="badge-rejected">❌ Rejected</span>',
  };

  async function loadBookings() {
    const status = document.getElementById('status-filter').value;
    const table  = document.getElementById('bookings-table');
    table.innerHTML = '<div class="d-flex justify-content-center py-4"><div class="spinner-border" style="color:var(--red)"></div></div>';

    try {
      const res      = await api.get('/bookings/partner');
      let bookings   = res.data || [];
      if (status) bookings = bookings.filter(b => b.booking_status === status);

      if (!bookings.length) {
        table.innerHTML = '<div class="text-center py-5 text-muted">No bookings found.</div>';
        return;
      }

      table.innerHTML = `
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead><tr><th>Code</th><th>Car</th><th>Customer</th><th>Dates</th><th>Total</th><th>Your Earnings</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              ${bookings.map(b => `
                <tr>
                  <td><code style="font-size:.78rem">${b.booking_code}</code></td>
                  <td>${b.car?.name ?? '—'}</td>
                  <td><div>${b.customer?.full_name ?? '—'}</div><div style="font-size:.75rem;color:#6c757d">${b.customer?.phone ?? ''}</div></td>
                  <td style="white-space:nowrap;font-size:.82rem">${formatDate(b.start_date)}<br>${formatDate(b.end_date)} <span class="text-muted">(${b.total_days}d)</span></td>
                  <td>${formatPHP(b.total_amount)}</td>
                  <td style="color:var(--dark);font-weight:700">${formatPHP(b.partner_net)}</td>
                  <td>${statusBadges[b.booking_status] ?? b.booking_status}</td>
                  <td>
                    <button class="btn btn-sm btn-outline-secondary me-1" onclick="viewDetail('${b.id}')">View</button>
                    ${b.booking_status === 'pending_review' ? `
                      <button class="btn btn-sm btn-success me-1" onclick="approveBooking('${b.id}')">✓</button>
                      <button class="btn btn-sm btn-outline-danger" onclick="rejectBooking('${b.id}')">✗</button>
                    ` : `<a href="/pages/messages/inbox.html?booking_id=${b.id}" class="btn btn-sm btn-outline-secondary">💬</a>`}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    } catch(err) { table.innerHTML = `<div class="text-center text-danger py-4">${err.message}</div>`; }
  }

  async function viewDetail(bookingId) {
    const modal = new bootstrap.Modal(document.getElementById('detailModal'));
    document.getElementById('modal-body').innerHTML = '<div class="d-flex justify-content-center py-3"><div class="spinner-border" style="color:var(--red)"></div></div>';
    document.getElementById('modal-footer').innerHTML = '';
    modal.show();

    try {
      const res = await api.get('/bookings/' + bookingId);
      const b   = res.data;
      const customer = b.customer;
      const kyc = customer?.customer_profile;

      document.getElementById('modal-body').innerHTML = `
        <div class="row g-3">
          <div class="col-md-6">
            <h6 class="fw-700" style="font-weight:700">Trip Details</h6>
            <table class="table table-sm table-borderless">
              <tr><td class="text-muted">Car</td><td><strong>${b.car?.name}</strong></td></tr>
              <tr><td class="text-muted">Booking Code</td><td><code>${b.booking_code}</code></td></tr>
              <tr><td class="text-muted">Pick-up</td><td>${formatDate(b.start_date)}</td></tr>
              <tr><td class="text-muted">Return</td><td>${formatDate(b.end_date)}</td></tr>
              <tr><td class="text-muted">Duration</td><td>${b.total_days} day(s)</td></tr>
              <tr><td class="text-muted">Payment</td><td>${b.payment_method}</td></tr>
              ${b.gcash_reference ? `<tr><td class="text-muted">GCash Ref</td><td><strong>${b.gcash_reference}</strong></td></tr>` : ''}
              <tr><td class="text-muted">Your Net</td><td style="font-weight:800;color:var(--dark)">${formatPHP(b.partner_net)}</td></tr>
            </table>
          </div>
          <div class="col-md-6">
            <h6 class="fw-700" style="font-weight:700">Customer Info</h6>
            <table class="table table-sm table-borderless">
              <tr><td class="text-muted">Name</td><td><strong>${customer?.full_name ?? '—'}</strong></td></tr>
              <tr><td class="text-muted">Phone</td><td>${customer?.phone ?? '—'}</td></tr>
              <tr><td class="text-muted">Email</td><td>${customer?.email ?? '—'}</td></tr>
              ${kyc ? `
              <tr><td class="text-muted">License No.</td><td>${kyc.drivers_license_number}</td></tr>
              <tr><td class="text-muted">License</td><td><a href="${kyc.drivers_license_url}" target="_blank" class="btn btn-sm btn-outline-secondary">View 📎</a></td></tr>
              ${kyc.valid_id_url ? `<tr><td class="text-muted">Valid ID</td><td><a href="${kyc.valid_id_url}" target="_blank" class="btn btn-sm btn-outline-secondary">View 📎</a></td></tr>` : ''}
              ` : '<tr><td colspan="2" class="text-muted">No KYC documents on file.</td></tr>'}
            </table>
          </div>
          ${b.special_requests ? `<div class="col-12"><div class="p-3 rounded" style="background:#f8f9fa"><strong>Special Requests:</strong> ${b.special_requests}</div></div>` : ''}
        </div>
      `;

      if (b.booking_status === 'pending_review') {
        document.getElementById('modal-footer').innerHTML = `
          <button class="btn btn-success" onclick="approveBooking('${b.id}'); bootstrap.Modal.getInstance(document.getElementById('detailModal')).hide()">✓ Approve Booking</button>
          <button class="btn btn-outline-danger" onclick="rejectBooking('${b.id}')">✗ Reject</button>
        `;
      }
    } catch(err) {
      document.getElementById('modal-body').innerHTML = `<div class="text-danger">${err.message}</div>`;
    }
  }

  async function approveBooking(id) {
    try {
      await api.patch('/bookings/' + id + '/approve');
      showToast('Booking approved! ✅ Customer has been notified.', 'success');
      loadBookings();
    } catch(err) { showToast(err.message, 'danger'); }
  }

  async function rejectBooking(id) {
    const reason = prompt('Reason for rejection (optional — will be sent to customer):');
    if (reason === null) return; // user cancelled
    try {
      await api.patch('/bookings/' + id + '/reject', { reason });
      showToast('Booking rejected. Customer notified.', 'success');
      loadBookings();
    } catch(err) { showToast(err.message, 'danger'); }
  }

  async function init() {
    await requireAuth(['partner', 'admin']);
    loadBookings();
  }

  init();
</script>
</body>
</html>
