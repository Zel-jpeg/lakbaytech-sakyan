<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Cars — Partner | Sakyan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --red: #e63946; --dark: #1a1a2e; }
    * { font-family: 'Inter', sans-serif; }
    body { background: #f8f9fa; }
    .sidebar { width: 240px; min-height: 100vh; background: var(--dark); position: fixed; top: 0; left: 0; padding: 24px 0; display: flex; flex-direction: column; }
    .sidebar-logo { padding: 0 20px 20px; font-size: 1.2rem; font-weight: 800; color: white; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 12px; }
    .sidebar-logo span { color: var(--red); }
    .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: rgba(255,255,255,.7); text-decoration: none; font-size: .9rem; font-weight: 500; transition: all .15s; }
    .sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(255,255,255,.08); color: white; border-left: 3px solid var(--red); }
    .sidebar-bottom { margin-top: auto; padding: 0 20px; }
    .main { margin-left: 240px; min-height: 100vh; }
    .topbar { background: white; padding: 16px 28px; border-bottom: 1px solid #f1f3f5; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 8px rgba(0,0,0,.05); }
    .page-content { padding: 28px; }
    .btn-sakyan { background: var(--red); color: white; font-weight: 600; border: none; border-radius: 8px; }
    .btn-sakyan:hover { background: #c1121f; color: white; }
    .car-card { background: white; border-radius: 14px; overflow: hidden; border: 1px solid #f1f3f5; box-shadow: 0 2px 8px rgba(0,0,0,.05); transition: all .2s; }
    .car-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.1); }
    .car-card img { width: 100%; height: 160px; object-fit: cover; }
    .car-card .card-body { padding: 16px; }
    .form-control:focus, .form-select:focus { border-color: var(--red); box-shadow: 0 0 0 .2rem rgba(230,57,70,.12); }
    .modal-header { border-bottom: 1px solid #f1f3f5; }
    .upload-zone { border: 2px dashed #dee2e6; border-radius: 10px; padding: 20px; text-align: center; cursor: pointer; transition: border-color .2s; }
    .upload-zone:hover { border-color: var(--red); }
    @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; } }
  </style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-logo">🚗 Sak<span>yan</span></div>
  <nav class="sidebar-nav">
    <a href="/pages/partner/dashboard.html">📊 Dashboard</a>
    <a href="/pages/partner/cars.html" class="active">🚗 My Cars</a>
    <a href="/pages/partner/bookings.html">📋 Bookings</a>
    <a href="/pages/messages/inbox.html">💬 Messages</a>
    <a href="/pages/partner/profile.html">⚙️ Profile</a>
  </nav>
  <div class="sidebar-bottom">
    <a href="#" onclick="logout()" class="btn btn-outline-light w-100 btn-sm mb-2" style="border-radius:8px">Sign Out</a>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <h5 class="mb-0 fw-700" style="font-weight:700">My Cars</h5>
    <button class="btn btn-sakyan" data-bs-toggle="modal" data-bs-target="#addCarModal">+ Add Car</button>
  </div>
  <div class="page-content">
    <div class="row g-4" id="cars-grid">
      <div class="col-12 d-flex justify-content-center py-5">
        <div class="spinner-border" style="color:var(--red)"></div>
      </div>
    </div>
  </div>
</div>

<!-- Add Car Modal -->
<div class="modal fade" id="addCarModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-700" style="font-weight:700">Add New Car</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="add-car-form">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Car Name *</label><input type="text" id="c-name" class="form-control" placeholder="e.g. Toyota Vios 2022" required/></div>
            <div class="col-md-3"><label class="form-label">Brand *</label><input type="text" id="c-brand" class="form-control" placeholder="Toyota" required/></div>
            <div class="col-md-3"><label class="form-label">Model *</label><input type="text" id="c-model" class="form-control" placeholder="Vios" required/></div>
            <div class="col-md-3"><label class="form-label">Year *</label><input type="number" id="c-year" class="form-control" placeholder="2022" min="2000" max="2030" required/></div>
            <div class="col-md-3"><label class="form-label">Color</label><input type="text" id="c-color" class="form-control" placeholder="White"/></div>
            <div class="col-md-3"><label class="form-label">Plate Number *</label><input type="text" id="c-plate" class="form-control" placeholder="ABC-1234" required/></div>
            <div class="col-md-3"><label class="form-label">Seats *</label><input type="number" id="c-seats" class="form-control" value="5" min="2" max="15" required/></div>
            <div class="col-md-4"><label class="form-label">Transmission *</label><select id="c-transmission" class="form-select" required><option value="">Select</option><option value="automatic">Automatic</option><option value="manual">Manual</option></select></div>
            <div class="col-md-4"><label class="form-label">Fuel Type *</label><select id="c-fuel" class="form-select" required><option value="">Select</option><option value="gasoline">Gasoline</option><option value="diesel">Diesel</option><option value="electric">Electric</option><option value="hybrid">Hybrid</option></select></div>
            <div class="col-md-4"><label class="form-label">Price per Day (₱) *</label><input type="number" id="c-price" class="form-control" placeholder="1500" min="1" required/></div>
            <div class="col-12"><label class="form-label">Location / Pickup Area *</label><input type="text" id="c-location" class="form-control" placeholder="e.g. Makati City, Metro Manila" required/></div>
            <div class="col-12"><label class="form-label">Description</label><textarea id="c-desc" class="form-control" rows="3" placeholder="Tell renters about this car…"></textarea></div>
            <div class="col-12">
              <label class="form-label">Car Photos * <small class="text-muted">(first photo becomes main photo)</small></label>
              <div class="upload-zone" onclick="document.getElementById('car-photos').click()">
                <input type="file" id="car-photos" accept="image/*" multiple style="display:none" onchange="previewPhotos(this)"/>
                <div>📷 Click to upload photos (up to 4)</div>
                <div id="photo-previews" class="d-flex gap-2 flex-wrap mt-2 justify-content-center"></div>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" id="submit-car-btn" class="btn btn-sakyan" onclick="submitCar()">List This Car</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/assets/js/config.js"></script>
<script src="/public/assets/js/utils.js"></script>
<script src="/public/assets/js/api.js"></script>
<script src="/public/assets/js/auth.js"></script>
<script>
  async function loadCars() {
    try {
      const res = await api.get('/partner/cars');
      const cars = res.data || [];
      const grid = document.getElementById('cars-grid');

      if (!cars.length) {
        grid.innerHTML = `<div class="col-12 text-center py-5 text-muted"><div style="font-size:3rem">🚗</div><h5>No cars listed yet</h5><button class="btn btn-sakyan mt-2" data-bs-toggle="modal" data-bs-target="#addCarModal">Add Your First Car</button></div>`;
        return;
      }

      grid.innerHTML = cars.map(car => `
        <div class="col-sm-6 col-xl-4">
          <div class="car-card">
            <img src="${car.primary_image?.image_url || 'https://via.placeholder.com/400x160?text=No+Photo'}" alt="${car.name}"/>
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <div class="fw-700" style="font-weight:700">${car.name}</div>
                  <div style="font-size:.82rem;color:#6c757d">📍 ${car.location}</div>
                </div>
                <span class="badge ${car.is_available ? 'bg-success' : 'bg-secondary'}" style="font-size:.7rem">${car.is_available ? 'Available' : 'Hidden'}</span>
              </div>
              <div class="mt-2 d-flex gap-2 flex-wrap" style="font-size:.78rem">
                <span class="badge bg-light text-dark">${car.transmission}</span>
                <span class="badge bg-light text-dark">${car.fuel_type}</span>
                <span class="badge bg-light text-dark">${car.seats} seats</span>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-3">
                <div style="font-size:1.1rem;font-weight:800;color:var(--red)">₱${parseFloat(car.price_per_day).toLocaleString()}<span style="font-weight:400;font-size:.75rem;color:#6c757d">/day</span></div>
                <div class="d-flex gap-1">
                  <button class="btn btn-sm btn-outline-secondary" onclick="toggleCar('${car.id}', ${!car.is_available})">${car.is_available ? 'Hide' : 'Show'}</button>
                  <button class="btn btn-sm btn-outline-danger" onclick="deleteCar('${car.id}')">🗑</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    } catch(err) { showToast(err.message, 'danger'); }
  }

  function previewPhotos(input) {
    const container = document.getElementById('photo-previews');
    container.innerHTML = '';
    Array.from(input.files).slice(0,4).forEach(file => {
      const img = document.createElement('img');
      img.src   = URL.createObjectURL(file);
      img.style = 'width:80px;height:60px;object-fit:cover;border-radius:6px';
      container.appendChild(img);
    });
  }

  async function submitCar() {
    const btn = document.getElementById('submit-car-btn');
    setButtonLoading(btn, true, 'Uploading...');
    showLoader();
    try {
      // Upload photos to Supabase Storage
      const files = document.getElementById('car-photos').files;
      const imageUrls = [];
      for (const file of Array.from(files).slice(0,4)) {
        const { createClient } = supabase;
        const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        const fileName = `cars/${Date.now()}-${file.name}`;
        const { data, error } = await sb.storage.from('cars').upload(fileName, file);
        if (error) throw new Error('Photo upload failed: ' + error.message);
        const { data: urlData } = sb.storage.from('cars').getPublicUrl(fileName);
        imageUrls.push(urlData.publicUrl);
      }

      await api.post('/cars', {
        name:         document.getElementById('c-name').value,
        brand:        document.getElementById('c-brand').value,
        model:        document.getElementById('c-model').value,
        year:         parseInt(document.getElementById('c-year').value),
        color:        document.getElementById('c-color').value,
        plate_number: document.getElementById('c-plate').value,
        seats:        parseInt(document.getElementById('c-seats').value),
        transmission: document.getElementById('c-transmission').value,
        fuel_type:    document.getElementById('c-fuel').value,
        price_per_day:parseFloat(document.getElementById('c-price').value),
        location:     document.getElementById('c-location').value,
        description:  document.getElementById('c-desc').value,
        images:       imageUrls,
      });

      showToast('Car listed successfully! 🎉', 'success');
      bootstrap.Modal.getInstance(document.getElementById('addCarModal')).hide();
      document.getElementById('add-car-form').reset();
      document.getElementById('photo-previews').innerHTML = '';
      loadCars();
    } catch(err) {
      showToast('Error: ' + err.message, 'danger');
    } finally {
      hideLoader();
      setButtonLoading(btn, false, 'List This Car');
    }
  }

  async function toggleCar(id, available) {
    try {
      await api.patch('/cars/' + id + '/toggle');
      showToast(available ? 'Car is now visible' : 'Car is now hidden', 'success');
      loadCars();
    } catch(err) { showToast(err.message, 'danger'); }
  }

  async function deleteCar(id) {
    if (!confirm('Delete this car? This cannot be undone.')) return;
    try {
      await api.delete('/cars/' + id);
      showToast('Car deleted.', 'success');
      loadCars();
    } catch(err) { showToast(err.message, 'danger'); }
  }

  async function init() {
    await requireAuth(['partner', 'admin']);
    loadCars();
  }

  init();
</script>
</body>
</html>
