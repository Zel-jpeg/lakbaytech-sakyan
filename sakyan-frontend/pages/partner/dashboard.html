<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Partner Dashboard — Sakyan</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root { --red: #e63946; --dark: #1a1a2e; }
    * { font-family: 'Inter', sans-serif; }
    body { background: #f8f9fa; }

    /* Sidebar */
    .sidebar { width: 240px; min-height: 100vh; background: var(--dark); position: fixed; top: 0; left: 0; padding: 24px 0; display: flex; flex-direction: column; }
    .sidebar-logo { padding: 0 20px 20px; font-size: 1.2rem; font-weight: 800; color: white; border-bottom: 1px solid rgba(255,255,255,.1); margin-bottom: 12px; }
    .sidebar-logo span { color: var(--red); }
    .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 12px 20px; color: rgba(255,255,255,.7); text-decoration: none; font-size: .9rem; font-weight: 500; transition: all .15s; }
    .sidebar-nav a:hover, .sidebar-nav a.active { background: rgba(255,255,255,.08); color: white; border-left: 3px solid var(--red); }
    .sidebar-badge { background: var(--red); color: white; border-radius: 10px; padding: 1px 7px; font-size: .7rem; margin-left: auto; }
    .sidebar-bottom { margin-top: auto; padding: 0 20px; }

    /* Main content */
    .main { margin-left: 240px; min-height: 100vh; }
    .topbar { background: white; padding: 16px 28px; border-bottom: 1px solid #f1f3f5; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 8px rgba(0,0,0,.05); }
    .page-content { padding: 28px; }

    /* Stat cards */
    .stat-card { background: white; border-radius: 14px; padding: 20px; border: 1px solid #f1f3f5; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .stat-card .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-bottom: 12px; }
    .stat-card .stat-num { font-size: 1.6rem; font-weight: 800; color: var(--dark); }
    .stat-card .stat-label { font-size: .82rem; color: #6c757d; margin-top: 2px; }

    /* Tables */
    .data-card { background: white; border-radius: 14px; padding: 20px; border: 1px solid #f1f3f5; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
    .data-card h6 { font-weight: 700; color: var(--dark); margin-bottom: 16px; }
    .table { font-size: .88rem; }
    .table thead th { font-weight: 600; color: #6c757d; border-bottom: 1px solid #f1f3f5; font-size: .78rem; text-transform: uppercase; letter-spacing: .5px; }
    .btn-sakyan { background: var(--red); color: white; font-weight: 600; border: none; border-radius: 8px; }
    .btn-sakyan:hover { background: #c1121f; color: white; }

    /* Status badges */
    .badge-pending  { background: #fff3cd; color: #856404; border-radius: 20px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
    .badge-approved { background: #d1e7dd; color: #0a3622; border-radius: 20px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
    .badge-rejected { background: #f8d7da; color: #842029; border-radius: 20px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
    .badge-active   { background: #cfe2ff; color: #084298; border-radius: 20px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }
    .badge-completed{ background: #e2e3e5; color: #383d41; border-radius: 20px; padding: 3px 10px; font-size: .72rem; font-weight: 700; }

    @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; } }
  </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="sidebar-logo">🚗 Sak<span>yan</span> <small style="font-size:.6rem;opacity:.5;display:block">Partner</small></div>
  <nav class="sidebar-nav">
    <a href="/pages/partner/dashboard.html" class="active">📊 Dashboard</a>
    <a href="/pages/partner/cars.html">🚗 My Cars</a>
    <a href="/pages/partner/bookings.html" id="booking-nav">📋 Bookings <span class="sidebar-badge d-none" id="pending-badge">0</span></a>
    <a href="/pages/messages/inbox.html">💬 Messages</a>
    <a href="/pages/partner/profile.html">⚙️ Profile</a>
  </nav>
  <div class="sidebar-bottom">
    <a href="#" onclick="logout()" class="btn btn-outline-light w-100 btn-sm mb-2" style="border-radius:8px">Sign Out</a>
    <a href="/public/index.html" class="btn btn-link text-white-50 w-100 btn-sm">← Customer View</a>
  </div>
</div>

<!-- Main -->
<div class="main">
  <div class="topbar">
    <div>
      <h5 class="mb-0 fw-700" style="font-weight:700">Dashboard</h5>
      <small class="text-muted" id="partner-name">Loading…</small>
    </div>
    <a href="/pages/partner/cars.html#add" class="btn btn-sakyan">+ Add Car</a>
  </div>
  <div class="page-content">
    <!-- Stats row -->
    <div class="row g-3 mb-4" id="stats-row">
      <div class="col-6 col-xl-3">
        <div class="stat-card"><div class="stat-icon" style="background:#fff3cd">📋</div><div class="stat-num" id="s-pending">—</div><div class="stat-label">Pending Bookings</div></div>
      </div>
      <div class="col-6 col-xl-3">
        <div class="stat-card"><div class="stat-icon" style="background:#d1e7dd">✅</div><div class="stat-num" id="s-approved">—</div><div class="stat-label">Approved</div></div>
      </div>
      <div class="col-6 col-xl-3">
        <div class="stat-card"><div class="stat-icon" style="background:#cfe2ff">🚗</div><div class="stat-num" id="s-cars">—</div><div class="stat-label">Listed Cars</div></div>
      </div>
      <div class="col-6 col-xl-3">
        <div class="stat-card"><div class="stat-icon" style="background:#f8d7da">💰</div><div class="stat-num" id="s-earnings">—</div><div class="stat-label">Est. Earnings</div></div>
      </div>
    </div>

    <!-- Recent Bookings -->
    <div class="data-card">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="mb-0">Recent Booking Requests</h6>
        <a href="/pages/partner/bookings.html" class="btn btn-sm btn-outline-secondary">View All</a>
      </div>
      <div id="recent-bookings">
        <div class="d-flex justify-content-center py-3"><div class="spinner-border spinner-border-sm" style="color:var(--red)"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/public/assets/js/config.js"></script>
<script src="/public/assets/js/utils.js"></script>
<script src="/public/assets/js/api.js"></script>
<script src="/public/assets/js/auth.js"></script>
<script>
  const statusMap = {
    pending_review: '<span class="badge-pending">⏳ Pending</span>',
    approved:  '<span class="badge-approved">✅ Approved</span>',
    active:    '<span class="badge-active">🚗 Active</span>',
    completed: '<span class="badge-completed">🏁 Completed</span>',
    rejected:  '<span class="badge-rejected">❌ Rejected</span>',
    cancelled: '<span class="badge-rejected">❌ Cancelled</span>',
  };

  async function init() {
    const user = await requireAuth(['partner', 'admin']);
    if (!user) return;

    try {
      const [partnerRes, bookingsRes, carsRes] = await Promise.all([
        api.get('/partners/me'),
        api.get('/bookings/partner'),
        api.get('/partner/cars'),
      ]);

      const partner  = partnerRes.data;
      const bookings = bookingsRes.data || [];
      const cars     = carsRes.data || [];

      document.getElementById('partner-name').textContent = partner.business_name;

      // Stats
      const pending  = bookings.filter(b => b.booking_status === 'pending_review').length;
      const approved = bookings.filter(b => b.booking_status === 'approved').length;
      const earnings = bookings.filter(b => b.booking_status === 'completed').reduce((s,b) => s + parseFloat(b.partner_net || 0), 0);

      document.getElementById('s-pending').textContent  = pending;
      document.getElementById('s-approved').textContent = approved;
      document.getElementById('s-cars').textContent     = cars.length;
      document.getElementById('s-earnings').textContent = formatPHP(earnings);

      if (pending > 0) {
        document.getElementById('pending-badge').textContent = pending;
        document.getElementById('pending-badge').classList.remove('d-none');
      }

      // Recent bookings table
      const recent = bookings.slice(0, 8);
      document.getElementById('recent-bookings').innerHTML = recent.length ? `
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead><tr><th>Code</th><th>Car</th><th>Customer</th><th>Dates</th><th>Amount</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
              ${recent.map(b => `
                <tr>
                  <td><code style="font-size:.8rem">${b.booking_code}</code></td>
                  <td>${b.car?.name ?? '—'}</td>
                  <td>${b.customer?.full_name ?? '—'}</td>
                  <td style="white-space:nowrap">${formatDate(b.start_date)} → ${formatDate(b.end_date)}</td>
                  <td>${formatPHP(b.partner_net)}</td>
                  <td>${statusMap[b.booking_status] ?? b.booking_status}</td>
                  <td>
                    ${b.booking_status === 'pending_review' ? `
                      <button class="btn btn-sm btn-success me-1" onclick="approveBooking('${b.id}')">✓</button>
                      <button class="btn btn-sm btn-outline-danger" onclick="rejectBooking('${b.id}')">✗</button>
                    ` : `<a href="/pages/messages/inbox.html?booking_id=${b.id}" class="btn btn-sm btn-outline-secondary">💬</a>`}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      ` : '<p class="text-center text-muted py-3">No bookings yet.</p>';

    } catch (err) {
      showToast('Error loading dashboard: ' + err.message, 'danger');
    }
  }

  async function approveBooking(id) {
    try {
      await api.patch('/bookings/' + id + '/approve');
      showToast('Booking approved!', 'success');
      init();
    } catch (err) { showToast(err.message, 'danger'); }
  }

  async function rejectBooking(id) {
    const reason = prompt('Reason for rejection (optional):');
    try {
      await api.patch('/bookings/' + id + '/reject', { reason });
      showToast('Booking rejected.', 'success');
      init();
    } catch (err) { showToast(err.message, 'danger'); }
  }

  init();
</script>
</body>
</html>
